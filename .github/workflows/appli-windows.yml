# Construit l'appli Windows « Guide Dofus Overlay » (dossier app-overlay) et publie l'installateur
# dans les Releases GitHub. Se lance quand l'appli change, ou à la main (onglet Actions).
name: Appli Windows

on:
  push:
    branches: [main]
    paths: ["app-overlay/**", ".github/workflows/appli-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-overlay/src-tauri -> target
      - name: Dépendances
        working-directory: app-overlay
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app-overlay
          tagName: appli-v__VERSION__
          releaseName: "Guide Dofus Overlay v__VERSION__"
          releaseBody: "Télécharge le fichier « Guide.Dofus.Overlay_…_x64-setup.exe » ci-dessous et lance-le. Windows peut afficher un avertissement (appli non signée) : clique sur « Informations complémentaires » puis « Exécuter quand même »."
          releaseDraft: false
          prerelease: false
